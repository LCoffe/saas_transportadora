<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Nova Encomenda</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 flex items-center justify-center min-h-screen py-8">

    <div class="bg-slate-800 p-6 rounded-lg shadow-lg border border-slate-700 w-full max-w-lg">
        <h2 class="text-xl font-bold mb-4 text-amber-400">📦 Cadastrar Encomenda</h2>

        <form id="form-encomenda" class="space-y-4">
            <div>
                <label class="block text-xs text-slate-400 mb-1">Descrição da Encomenda</label>
                <input type="text" id="descricao" required placeholder="Ex: Caixa de eletrônicos"
                    class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm focus:border-amber-500 focus:outline-none">
            </div>

            <hr class="border-slate-700 my-2">
            <p class="text-xs font-semibold text-slate-300">Endereço de Entrega</p>

            <div class="grid grid-cols-3 gap-3">
                <div class="col-span-2">
                    <label class="block text-xs text-slate-400 mb-1">Rua / Logradouro</label>
                    <input type="text" id="rua" required placeholder="Ex: Av. Brasil"
                        class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm focus:border-amber-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Número</label>
                    <input type="text" id="numero" required placeholder="Ex: 1500"
                        class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm focus:border-amber-500 focus:outline-none">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Complemento (opcional)</label>
                    <input type="text" id="complemento" placeholder="Ex: Apto 302"
                        class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm focus:border-amber-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Bairro</label>
                    <input type="text" id="bairro" required placeholder="Ex: Centro"
                        class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm focus:border-amber-500 focus:outline-none">
                </div>
            </div>

            <div class="grid grid-cols-3 gap-3">
                <div class="col-span-2">
                    <label class="block text-xs text-slate-400 mb-1">Cidade</label>
                    <input type="text" id="cidade" required placeholder="Ex: Curitiba"
                        class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm focus:border-amber-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">UF</label>
                    <input type="text" id="estado" maxlength="2" required placeholder="PR"
                        class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm uppercase focus:border-amber-500 focus:outline-none">
                </div>
            </div>

            <button type="submit" 
                class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-2 rounded text-sm transition mt-2">
                Salvar Encomenda
            </button>

            <!-- voltar para o painel -->
            <a href="index.html" 
                class="w-full block text-center bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium py-2 rounded text-sm transition mt-2">
                ← Voltar para o Painel (Início)
            </a>
        </form>

        <div id="resultado" class="hidden mt-4 p-3 bg-slate-900/80 border border-emerald-500/30 rounded text-xs">
            <p class="text-emerald-400 font-semibold mb-1">✓ Cadastrado com sucesso!</p>
            <p class="text-slate-300">Serial: <span id="res-serial" class="font-mono text-amber-400"></span></p>
        </div>
    </div>

    <script>
        document.getElementById("form-encomenda").addEventListener("submit", async (e) => {
            e.preventDefault();
            
            const payload = {
                descricao: document.getElementById("descricao").value,
                rua: document.getElementById("rua").value,
                numero: document.getElementById("numero").value,
                complemento: document.getElementById("complemento").value || null,
                bairro: document.getElementById("bairro").value,
                cidade: document.getElementById("cidade").value,
                estado: document.getElementById("estado").value
            };

            const response = await fetch("/encomendas/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                const data = await response.json();
                document.getElementById("res-serial").innerText = data.serial;
                document.getElementById("resultado").classList.remove("hidden");
                document.getElementById("form-encomenda").reset();
            } else {
                alert("Erro ao cadastrar encomenda.");
            }
        });
    </script>
</body>
</html>
